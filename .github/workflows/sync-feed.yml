name: Sync social feed
# Pulls Instagram and original X posts into public/feed, and Bilibili and
# YouTube uploads into public/videos (see README).

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/sync-feed.yml', 'package.json', 'package-lock.json']

permissions:
  contents: write

concurrency:
  group: sync-feed
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run sync-feed
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
          X_USERNAME: ${{ vars.X_USERNAME }}

      # Instagram returns a new token string on every refresh. Store it so the
      # secret never reaches its 60-day expiry. Needs a GH_PAT secret (see README).
      - name: Save refreshed Instagram token
        if: ${{ hashFiles('.ig-token') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT not set — IG_ACCESS_TOKEN will expire 60 days after you last set it."
          else
            gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < .ig-token
          fi
          rm -f .ig-token

      - name: Commit updated feed
        run: |
          git add public/feed public/videos
          if git diff --cached --quiet; then
            echo "No feed or video changes."
            exit 0
          fi
          git config user.name "feed-bot"
          git config user.email "kirisamevanilla@gmail.com"
          git commit -m "chore: sync social feed"
          git push
